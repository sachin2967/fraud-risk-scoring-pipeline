services:
  fraud-train:
    build: .
    command: ["python", "scripts/evaluate_openml_benchmark.py"]
    environment:
      FRAUD_DATA_DIR: /app/var/data
      FRAUD_MODEL_DIR: /app/var/models
      FRAUD_MODEL_PATH: /app/var/models/credit_card_fraud_model.joblib
      FRAUD_REPORT_PATH: /app/var/benchmark_report.json
    volumes:
      - fraud-artifacts:/app/var
    restart: "no"

  fraud-api:
    build: .
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      FRAUD_DATA_DIR: /app/var/data
      FRAUD_MODEL_DIR: /app/var/models
      FRAUD_MODEL_PATH: /app/var/models/credit_card_fraud_model.joblib
      FRAUD_REPORT_PATH: /app/var/benchmark_report.json
    ports:
      - "127.0.0.1:${FRAUD_API_PORT:-8010}:8000"
    volumes:
      - fraud-artifacts:/app/var:ro
    depends_on:
      fraud-train:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  fraud-dashboard:
    build: .
    command: ["streamlit", "run", "streamlit_app/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    environment:
      FRAUD_DATA_DIR: /app/var/data
      FRAUD_MODEL_DIR: /app/var/models
      FRAUD_MODEL_PATH: /app/var/models/credit_card_fraud_model.joblib
      FRAUD_REPORT_PATH: /app/var/benchmark_report.json
    ports:
      - "127.0.0.1:${FRAUD_DASHBOARD_PORT:-8510}:8501"
    volumes:
      - fraud-artifacts:/app/var:ro
    depends_on:
      fraud-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fraud-artifacts:
